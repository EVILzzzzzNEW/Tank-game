/* Loads the Photon library only when MULTIPLAYER is tapped, so the game starts even if it fails */
function loadPhoton(cb){

/* ---------- Input ---------- */

/* ---------- Main loop ---------- */
function aimRay(){const o=cam.position,d=new THREE.Vector3();cam.getWorldDirection(d);RC.set(o,d);RC.far=700;let hit=RC.intersectObjects(TG,false)[0],td=hit?hit.distance:700;
for(let s=4;s<td;s+=2){const x=o.x+d.x*s,z=o.z+d.z*s;if(Math.abs(x)<250&&Math.abs(z)<250&&o.y+d.y*s<hf(x,z)){td=s;hit=null;break}}

let last=0;
function loop(ts){requestAnimationFrame(loop);rs();const dt=Math.min(.05,(ts-last)/1000||0);last=ts;const scope=started&&(keys.ShiftLeft||keys.ShiftRight||rmb||scTog);
if(started&&!P.dead){const f=cl((keys.KeyW?1:0)-(keys.KeyS?.5:0)-jy,-.5,1),tn=cl((keys.KeyA?1:0)-(keys.KeyD?1:0)-jx,-1,1);P.h+=tn*(P.trn||.9)*dt;const sp=(P.spd||9)*f*dt,dx=Math.sin(P.h)*sp,dz=Math.cos(P.h)*sp;if(!blk(P.x+dx,P.z))P.x+=dx;if(!blk(P.x,P.z+dz))P.z+=dz}
EN.forEach(t=>{if(t.dead)return;t.h+=t.sp*dt;const dx=P.x-t.x,dz=P.z-t.z,dd=Math.hypot(dx,dz),az=Math.atan2(dx,dz);
if(started&&dd<230){t.ty+=cl(wr(az-t.ty),-.9*dt,.9*dt);t.ep+=cl(cl(Math.atan2(P.g.position.y-t.g.position.y-.5+.5*9.8*(dd/V0)**2,dd),-.14,.3)-t.ep,-.4*dt,.4*dt);t.rl-=dt;
if(t.rl<=0&&Math.abs(wr(az-t.ty))<.06){shoot(t,{v:V0,pen:t.o.pen||300,en:1,sp:.008+dd*.00005});t.rl=rnd(6,9);t.rc=1}}
else t.ty=t.h+Math.sin(ts/2500+t.sp*40)*.6;t.rc=Math.max(0,t.rc-dt*2.5);place(t)});
/* Multiplayer: interpolate remote tanks / send own state (every 100ms) */
MP.rem.forEach(t=>{if(t.dead)return;const k=Math.min(1,dt*10);t.x+=(t.tx-t.x)*k;t.z+=(t.tz-t.z)*k;t.h+=wr(t.th-t.h)*k;t.ty+=wr(t.tty-t.ty)*k;t.ep+=(t.tep-t.ep)*k;place(t)});
if(MP.on&&ts-MP.last>100){MP.last=ts;mpSend(1,{n:MP.name,id:P.id,br:P.br,x:P.x,z:P.z,h:P.h,ty:P.ty,ep:P.ep,hp:P.hp,dead:P.dead?1:0})}
/* Camera: third-person (turret follows camera direction) / scope (near muzzle, zoomed) */
const tf=scope?7:60;if(Math.abs(fov-tf)>.05){fov+=(tf-fov)*Math.min(1,dt*10);cam.fov=fov;cam.updateProjectionMatrix()}
const sy=scope?.0018*(Math.sin(ts/610)+.6*Math.sin(ts/170)):0,sp2=scope?.0014*(Math.sin(ts/480+1)+.6*Math.cos(ts/150)):0,yy=yaw+sy,pp=pit+sp2,d=new THREE.Vector3(Math.sin(yy)*Math.cos(pp),Math.sin(pp),Math.cos(yy)*Math.cos(pp));P.g.visible=!P.dead&&!(scope&&fov<30);
if(scope){const gp=new THREE.Vector3();P.gun.getWorldPosition(gp);cam.position.copy(gp).add(new THREE.Vector3(0,.35,0))}
else{const pv=new THREE.Vector3(P.x,hf(P.x,P.z)+3.4,P.z);cam.position.copy(pv).addScaledVector(d,-15);cam.position.y=Math.max(cam.position.y,hf(cam.position.x,cam.position.z)+1.5)}
cam.lookAt(cam.position.clone().add(d));cam.updateMatrixWorld();
const ar=aimRay(),g0=new THREE.Vector3();P.gun.getWorldPosition(g0);
const ddx=ar.pt.x-g0.x,ddz=ar.pt.z-g0.z,hd=Math.hypot(ddx,ddz),drop=scope?0:.5*9.8*(hd/V0)**2,el=Math.atan2(ar.pt.y-g0.y+drop,Math.max(hd,1));
const trv=P.tr||.8;P.ty+=cl(wr(Math.atan2(ddx,ddz)-P.ty)*Math.min(1,dt*2.5),-trv*dt,trv*dt);P.ep+=cl((cl(el,-.14,.35)-P.ep)*Math.min(1,dt*2.5),-trv*.45*dt,trv*.45*dt);P.rc=Math.max(0,P.rc-dt*2.5);P.rl=Math.max(0,P.rl-dt);P.ml=Math.max(0,P.ml-dt);place(P);
const mq=new THREE.Quaternion(),md=new THREE.Vector3(0,0,1),mp=new THREE.Vector3();P.muz.getWorldPosition(mp);P.muz.getWorldQuaternion(mq);md.applyQuaternion(mq);
if(started&&down&&P.rl<=0&&!P.dead){shoot(P,{v:V0,pen:PEN});P.rl=RLD;P.rc=1}
if(started&&(keys.Space||mgDown)&&P.ml<=0&&!P.dead){shoot(P,{v:850,pen:22,mg:1,sp:.012});P.ml=.1}
upShells(dt);upFX(dt);
/* HUD / penetration indicator / barrel direction marker */
const pi=$('pi');RC.set(mp,md);RC.far=700;let h=RC.intersectObjects(TG,false)[0];if(h){for(let s=4;s<h.distance;s+=3){if(mp.y+md.y*s<hf(mp.x+md.x*s,mp.z+md.z*s)){h=null;break}}}
if(h&&h.object.userData.tank&&!h.object.userData.tank.dead&&started){const c=calc(h,md,h.distance),q=scr(h.point);pi.style.display='block';pi.className=cls(c);pi.style.left=q[0]+'px';pi.style.top=q[1]+'px';
$('pt').textContent=(h.object.userData.tank.nm||'')+' BR '+h.object.userData.tank.br+'　Effective armor '+(c.eff|0)+'mm (actual '+c.base+'mm / angle '+((c.ang*57.3)|0)+'°)　Penetration '+(c.pen|0)+'mm'+(c.rico?' [ricochet]':'')}
else{pi.style.display='none';$('pt').textContent=''}
const gq=scr(mp.clone().addScaledVector(md,ar.td).setY(mp.y+md.y*ar.td-.5*9.8*(ar.td/V0)**2)),gm=$('gm');gm.style.display=scope||!gq[2]?'none':'block';gm.style.left=gq[0]+'px';gm.style.top=gq[1]+'px';
$('scope').style.display=scope&&fov<30?'block':'none';$('cd').style.display=scope&&fov<30?'none':'block';
$('hl').innerHTML=(MP.on?'<b>MULTIPLAYER</b> '+(MP.rem.size+1)+' players<br>':'')+(PT[P.id]?PT[P.id].n+'　HP '+Math.max(0,P.hp|0)+'<br>':'')+'Shell: '+(PT[P.id]?PT[P.id].sh:'')+' (penetration '+PEN+'mm) / Velocity '+V0+'m/s<br>Range '+(ar.td|0)+'m　Kills '+(SV?SV.kills:0)+'<div id="rb"><i style="width:'+(100-P.rl/RLD*100)+'%"></i></div>'+(P.rl>0?'Reloading '+P.rl.toFixed(1)+'s':'Ready to fire');
if(inG&&GT){GT.g.rotation.y=ts/5500;GT.tu.rotation.y=Math.sin(ts/2200)*.4}
R.render(inG?gsc:sc,inG?gcam:cam)}
/* ---------- WT-style garage / tech tree / economy ---------- */
function tst(id){const t=PT[id];if(SV.own[id])return 'own';const r=SV.res[id]||0;if(r>=t.rp)return 'buy';if(t.par&&!(SV.own[t.par]||(SV.res[t.par]||0)>=PT[t.par].rp))return 'lock';return r>0?'ing':'rd'}
const TL={own:'Owned',buy:'Available to buy',lock:'Locked 🔒',ing:'Researching',rd:'Research needed'};
function research(id){const s=tst(id);if(s!='rd'&&s!='ing')return;const t=PT[id],n=Math.min(SV.rp,t.rp-(SV.res[id]||0));if(n<=0)return;SV.res[id]=(SV.res[id]||0)+n;SV.rp-=n;save();renderTree()}
function buyTank(id){const t=PT[id];if(tst(id)!='buy'||SV.sl<t.ls)return;SV.sl-=t.ls;SV.own[id]=1;SV.sel=id;SV.nat=t.nat;save();renderTree()}
function renderTree(){const el=$('tree');el.style.display='flex';
let h='<div class=th><b>Research</b> 🪙 '+SV.sl+' SL / 🔬 '+SV.rp+' RP <span>'+Object.keys(NATN).map(n=>'<button class=tab'+(n==SV.nat?'-on':'')+' data-n='+n+'>'+NATN[n]+'</button>').join('')+'</span><button id=tx>Close</button></div><div class=chain>';
h+=Object.keys(PT).filter(i=>PT[i].nat==SV.nat).map((i,k)=>{const t=PT[i],s=tst(i),r=SV.res[i]||0;return (k?'<div class=ar>➡</div>':'')+'<div class=nd-'+s+'><b>'+t.n+'</b><br>BR '+t.br.toFixed(1)+'<br>'+TL[s]+(s=='ing'?' '+r+'/'+t.rp:'')+'<br>'+(s=='rd'||s=='ing'?'<button data-r='+i+'>Research RP '+(t.rp-r)+'</button>':s=='buy'?'<button data-b='+i+'>Buy SL '+t.ls+'</button>':'')+'</div>'}).join('')+'</div>';
el.innerHTML=h;el.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{SV.nat=b.dataset.n;renderTree()});el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>research(b.dataset.r));el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>buyTank(b.dataset.b));

if(!SV.own[SV.sel])SV.sel=Object.keys(SV.own)[0];
const el=$('gui'),t=PT[SV.sel],dead=SV.dead[SV.sel],own=Object.keys(PT).filter(i=>SV.own[i]),alive=own.some(i=>!SV.dead[i]),rcost=q=>Math.round(100+q.br*30);

+`<div class=info>${msg?'<span class=wr>'+msg+'</span><br>':''}${alive?'':'<span class=wr>GAME OVER — all tanks destroyed</span> <button id=ra>Repair all tanks for free</button><br>'}<b>${t.n}</b>　BR ${t.br.toFixed(1)}　Armor front ${t.o.arm.front} / side ${t.o.arm.side} / rear ${t.o.arm.rear}mm　Penetration ${t.pen}mm (${t.sh})　Speed ${t.sp}${dead?'　<span class=wr>Destroyed</span>':''}</div>`
+`<div class=slots>${own.map(i=>{const q=PT[i],d=SV.dead[i];return `<div class=${i==SV.sel?'slot-on':'slot'} data-s=${i}><b>${q.n}</b><br>BR ${q.br.toFixed(1)}<br>${d?`🔴 Destroyed <button data-f=${i}>Repair ${rcost(q)} SL</button>`:'🟢 Ready'}</div>`}).join('')}</div>`;
$('go').onclick=()=>{if(!dead)deploy(SV.sel)};$('mpb').onclick=()=>{if(!dead)mpStart()};$('rs').onclick=()=>renderTree();$('lo').onclick=()=>{save();U=null;SV=null;el.style.display='none';showScreen('login')};
