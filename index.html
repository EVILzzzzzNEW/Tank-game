function openPromo(m){openPn('<h3>Promo codes</h3><small>Enter a code to unlock a reward on this account.</small><p><input id=pci maxlength=20 placeholder="Code" style="font-size:16px;padding:6px;text-transform:uppercase"> <button id=pcr>Redeem</button></p><small id=pcm class=wr>'+(m||'')+'</small>');
 $('pcr').onclick=()=>{const c=$('pci').value.trim().toUpperCase(),id=PROMOS[c];
  if(!id){openPromo('Unknown code');return}
  if(SV.own[id]){openPromo('Already redeemed');return}
  SV.own[id]=1;SV.promo=SV.promo||{};SV.promo[c]=1;save();closePn();renderGarage('Promo unlocked: GOONER tank')}}
function openSettings(){const K=SET.k,b=(n,v,l)=>'<button data-s='+n+' data-v='+v+' class='+(SET[n]==v?'tab-on':'')+'>'+l+'</button>';
 openPn('<h3>Settings</h3><small>Saved to this account in this browser.</small>'+
 '<p>Max FPS '+b('fps',30,'30')+b('fps',60,'60')+b('fps',120,'120')+b('fps',0,'Unlimited')+'</p>'+
 '<p>Aspect ratio '+b('ar','16:9','16:9 (default)')+b('ar','4:3','4:3 (stretched)')+' <small>4:3 draws a 4:3 picture and stretches it to fill the screen.</small></p>'+
'<p>Graphics '+b('gfx',0,'Low')+b('gfx',1,'Medium')+b('gfx',2,'High')+' <small>(draw distance, trees, terrain; applies next battle)</small></p>'+
 '<p>Quality '+b('q',.6,'Low')+b('q',1,'Medium')+b('q',2,'High')+' <small>(render resolution)</small></p>'+
 '<p>Sensitivity <input type=range min=.3 max=2.5 step=.1 value='+SET.sens+' id=sn> <span id=sv>'+SET.sens.toFixed(1)+'</span></p>'+
 '<h4>Mobile controls</h4>'+'<p>Size '+b('mcs',.8,'Small')+b('mcs',1,'Medium')+b('mcs',1.25,'Large')+'</p>'+'<p>Opacity '+b('mco',.4,'Faint')+b('mco',.7,'Normal')+b('mco',1,'Solid')+'</p>'+'<p>Layout '+b('swap',0,'Joystick left')+b('swap',1,'Joystick right')+'</p>'+'<h4>Controls</h4><small>Tap a control, then press a key or mouse button. Esc cancels.</small>'+
 Object.keys(KN).map(a=>'<div class=kr>'+KN[a]+' <button data-kb='+a+'>'+(WK===a?'Press a key…':kname(K[a]))+'</button></div>').join('')+
 '<p><button id=kd>Reset defaults</button></p>');
 const p=$('pn');
 p.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{const v=x.dataset.v;SET[x.dataset.s]=isNaN(+v)?v:+v;saveSet();applyGfx();openSettings()});
 p.querySelectorAll('[data-kb]').forEach(x=>x.onclick=()=>{WK=x.dataset.kb;openSettings()});
 $('sn').oninput=e=>{SET.sens=+e.target.value;$('sv').textContent=SET.sens.toFixed(1);saveSet()};
 $('kd').onclick=()=>{SET=DSET();saveSet();applyGfx();openSettings()}}
addEventListener('keydown',e=>{if(!WK)return;e.preventDefault();e.stopPropagation();if(e.code!=='Escape')SET.k[WK]=e.code;WK=null;saveSet();openSettings()},true);
addEventListener('mousedown',e=>{if(!WK)return;e.preventDefault();e.stopPropagation();SET.k[WK]='Mouse'+e.button;WK=null;saveSet();openSettings()},true);
dbg('8. Starting login screen…');
applyGfx();showScreen('login');requestAnimationFrame(loop);
dbg('9. Game loop started OK (if you see this, the game is running)');

};
</script>
</body></html>
